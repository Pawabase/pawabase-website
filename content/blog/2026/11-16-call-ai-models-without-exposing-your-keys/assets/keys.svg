  <text x="100" y="92" font-family="Plus Jakarta Sans" font-weight="700" font-size="16" fill="rgba(252,248,245,0.38)" text-anchor="start" letter-spacing="3">WITHOUT A GATEWAY</text>
  <text x="100" y="130" font-family="Plus Jakarta Sans" font-weight="500" font-size="23" fill="rgba(252,248,245,0.6)" text-anchor="start" letter-spacing="0">The provider's key ships inside your app, to every visitor.</text>
