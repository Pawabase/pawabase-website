<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity=".05"/></pattern>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset=".08" stop-color="#ffffff"/><stop offset=".6" stop-color="#d8d6d3"/><stop offset="1" stop-color="#8e8b87"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffbf9a"/><stop offset=".45" stop-color="#ff8a4a"/><stop offset="1" stop-color="#ff6a00"/></linearGradient>
  </defs>
  <rect width="1600" height="640" fill="#0b0b0d"/>
  <rect width="1600" height="640" fill="url(#dots)"/>
  <text x="160" y="110" font-family="Plus Jakarta Sans" font-weight="700" font-size="16" fill="#ff6a00" text-anchor="start" letter-spacing="3">ONE AFTERNOON</text>
  <text x="160" y="150" font-family="Plus Jakarta Sans" font-weight="500" font-size="24" fill="rgba(252,248,245,0.6)" text-anchor="start" letter-spacing="0">From an empty project to a backend in production.</text>
  <line x1="160" y1="330" x2="1440" y2="330" stroke="rgba(255,106,0,.45)" stroke-dasharray="4 8" stroke-width="2"/>
  <circle cx="160" cy="330" r="12" fill="#121214" stroke="#ff6a00" stroke-width="2"/>
    <text x="160" y="270" font-family="JetBrains Mono, Menlo, monospace" font-weight="700" font-size="20" fill="#ff6a00" text-anchor="middle" letter-spacing="0">1:00</text>
    <text x="160" y="400" font-family="Plus Jakarta Sans" font-weight="700" font-size="30" fill="#fcf8f5" text-anchor="middle" letter-spacing="0">Tables</text>
    <text x="160" y="438" font-family="Plus Jakarta Sans" font-weight="500" font-size="20" fill="rgba(252,248,245,0.6)" text-anchor="middle" letter-spacing="0">Model the data</text>
  <circle cx="480" cy="330" r="12" fill="#121214" stroke="#ff6a00" stroke-width="2"/>
    <text x="480" y="270" font-family="JetBrains Mono, Menlo, monospace" font-weight="700" font-size="20" fill="#ff6a00" text-anchor="middle" letter-spacing="0">1:40</text>
    <text x="480" y="400" font-family="Plus Jakarta Sans" font-weight="700" font-size="30" fill="#fcf8f5" text-anchor="middle" letter-spacing="0">Policies</text>
    <text x="480" y="438" font-family="Plus Jakarta Sans" font-weight="500" font-size="20" fill="rgba(252,248,245,0.6)" text-anchor="middle" letter-spacing="0">Who may do what</text>
  <circle cx="800" cy="330" r="12" fill="#121214" stroke="#ff6a00" stroke-width="2"/>
    <text x="800" y="270" font-family="JetBrains Mono, Menlo, monospace" font-weight="700" font-size="20" fill="#ff6a00" text-anchor="middle" letter-spacing="0">2:20</text>
    <text x="800" y="400" font-family="Plus Jakarta Sans" font-weight="700" font-size="30" fill="#fcf8f5" text-anchor="middle" letter-spacing="0">Auth</text>
    <text x="800" y="438" font-family="Plus Jakarta Sans" font-weight="500" font-size="20" fill="rgba(252,248,245,0.6)" text-anchor="middle" letter-spacing="0">Sign-in and orgs</text>
  <circle cx="1120" cy="330" r="12" fill="#121214" stroke="#ff6a00" stroke-width="2"/>
    <text x="1120" y="270" font-family="JetBrains Mono, Menlo, monospace" font-weight="700" font-size="20" fill="#ff6a00" text-anchor="middle" letter-spacing="0">3:10</text>
    <text x="1120" y="400" font-family="Plus Jakarta Sans" font-weight="700" font-size="30" fill="#fcf8f5" text-anchor="middle" letter-spacing="0">Flows</text>
    <text x="1120" y="438" font-family="Plus Jakarta Sans" font-weight="500" font-size="20" fill="rgba(252,248,245,0.6)" text-anchor="middle" letter-spacing="0">Invites, email, jobs</text>
  <circle cx="1440" cy="330" r="18" fill="#ff6a00" stroke="#ff6a00" stroke-width="2"/>
    <text x="1440" y="270" font-family="JetBrains Mono, Menlo, monospace" font-weight="700" font-size="20" fill="#ff6a00" text-anchor="middle" letter-spacing="0">4:00</text>
    <text x="1440" y="400" font-family="Plus Jakarta Sans" font-weight="700" font-size="30" fill="#fcf8f5" text-anchor="middle" letter-spacing="0">Ship</text>
    <text x="1440" y="438" font-family="Plus Jakarta Sans" font-weight="500" font-size="20" fill="rgba(252,248,245,0.6)" text-anchor="middle" letter-spacing="0">Promote to production</text>
</svg>