  <text x="100" y="440" font-family="Plus Jakarta Sans" font-weight="700" font-size="16" fill="#ff6a00" text-anchor="start" letter-spacing="3">WITH THE PAWABASE AI GATEWAY</text>
  <text x="100" y="478" font-family="Plus Jakarta Sans" font-weight="500" font-size="23" fill="rgba(252,248,245,0.6)" text-anchor="start" letter-spacing="0">Your app holds a publishable key. The provider's key never leaves the server.</text>
