<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity=".05"/></pattern>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset=".08" stop-color="#ffffff"/><stop offset=".6" stop-color="#d8d6d3"/><stop offset="1" stop-color="#8e8b87"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffbf9a"/><stop offset=".45" stop-color="#ff8a4a"/><stop offset="1" stop-color="#ff6a00"/></linearGradient>
  </defs>
  <rect width="1600" height="760" fill="#0b0b0d"/>
  <rect width="1600" height="760" fill="url(#dots)"/>
  <text x="120" y="100" font-family="Plus Jakarta Sans" font-weight="700" font-size="16" fill="#ff6a00" text-anchor="start" letter-spacing="3">ONE RULE</text>
  <text x="120" y="140" font-family="Plus Jakarta Sans" font-weight="500" font-size="24" fill="rgba(252,248,245,0.6)" text-anchor="start" letter-spacing="0">Write a policy once. Every part that accepts one enforces it.</text>
  <rect x="120" y="270" width="580" height="220" rx="20" fill="#121214" stroke="rgba(255,106,0,.55)"/>
  <text x="150" y="318" font-family="JetBrains Mono, Menlo, monospace" font-weight="700" font-size="24" fill="#ffb27a" text-anchor="start" letter-spacing="0">team_member</text>
  <text x="150" y="368" font-family="Plus Jakarta Sans" font-weight="500" font-size="24" fill="#fcf8f5" text-anchor="start" letter-spacing="0">Signed in, and a member of the</text>
  <text x="150" y="404" font-family="Plus Jakarta Sans" font-weight="500" font-size="24" fill="#fcf8f5" text-anchor="start" letter-spacing="0">organization the row belongs to,</text>
  <text x="150" y="440" font-family="Plus Jakarta Sans" font-weight="500" font-size="24" fill="#fcf8f5" text-anchor="start" letter-spacing="0">as an owner, admin or member.</text>
  <path d="M 700 380 C 860 380, 900 180, 1060 180" fill="none" stroke="rgba(255,106,0,.45)" stroke-dasharray="4 6" stroke-width="2"/>
    <g>
  <rect x="1060" y="140" width="380" height="80" rx="16" fill="#121214" stroke="rgba(252,248,245,.12)"/>
  <text x="1082" y="178" font-family="Plus Jakarta Sans" font-weight="600" font-size="21" fill="#fcf8f5" text-anchor="start" letter-spacing="0">Tables</text>
  <text x="1082" y="206" font-family="Plus Jakarta Sans" font-weight="500" font-size="15" fill="rgba(252,248,245,0.6)" text-anchor="start" letter-spacing="0">read, write, delete</text>
</g>
  <path d="M 700 380 C 860 380, 900 290, 1060 290" fill="none" stroke="rgba(255,106,0,.45)" stroke-dasharray="4 6" stroke-width="2"/>
    <g>
  <rect x="1060" y="250" width="380" height="80" rx="16" fill="#121214" stroke="rgba(252,248,245,.12)"/>
  <text x="1082" y="288" font-family="Plus Jakarta Sans" font-weight="600" font-size="21" fill="#fcf8f5" text-anchor="start" letter-spacing="0">Files</text>
  <text x="1082" y="316" font-family="Plus Jakarta Sans" font-weight="500" font-size="15" fill="rgba(252,248,245,0.6)" text-anchor="start" letter-spacing="0">download, upload</text>
</g>
  <path d="M 700 380 C 860 380, 900 400, 1060 400" fill="none" stroke="rgba(255,106,0,.45)" stroke-dasharray="4 6" stroke-width="2"/>
    <g>
  <rect x="1060" y="360" width="380" height="80" rx="16" fill="#121214" stroke="rgba(252,248,245,.12)"/>
  <text x="1082" y="398" font-family="Plus Jakarta Sans" font-weight="600" font-size="21" fill="#fcf8f5" text-anchor="start" letter-spacing="0">Channels</text>
  <text x="1082" y="426" font-family="Plus Jakarta Sans" font-weight="500" font-size="15" fill="rgba(252,248,245,0.6)" text-anchor="start" letter-spacing="0">subscribe, publish</text>
</g>
  <path d="M 700 380 C 860 380, 900 510, 1060 510" fill="none" stroke="rgba(255,106,0,.45)" stroke-dasharray="4 6" stroke-width="2"/>
    <g>
  <rect x="1060" y="470" width="380" height="80" rx="16" fill="#121214" stroke="rgba(252,248,245,.12)"/>
  <text x="1082" y="508" font-family="Plus Jakarta Sans" font-weight="600" font-size="21" fill="#fcf8f5" text-anchor="start" letter-spacing="0">Flows</text>
  <text x="1082" y="536" font-family="Plus Jakarta Sans" font-weight="500" font-size="15" fill="rgba(252,248,245,0.6)" text-anchor="start" letter-spacing="0">who may run it</text>
</g>
  <path d="M 700 380 C 860 380, 900 620, 1060 620" fill="none" stroke="rgba(255,106,0,.45)" stroke-dasharray="4 6" stroke-width="2"/>
    <g>
  <rect x="1060" y="580" width="380" height="80" rx="16" fill="#121214" stroke="rgba(252,248,245,.12)"/>
  <text x="1082" y="618" font-family="Plus Jakarta Sans" font-weight="600" font-size="21" fill="#fcf8f5" text-anchor="start" letter-spacing="0">Routes</text>
  <text x="1082" y="646" font-family="Plus Jakarta Sans" font-weight="500" font-size="15" fill="rgba(252,248,245,0.6)" text-anchor="start" letter-spacing="0">who may call it</text>
</g>
</svg>