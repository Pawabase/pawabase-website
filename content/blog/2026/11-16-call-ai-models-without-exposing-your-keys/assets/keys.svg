    <text x="124" y="222" font-family="Plus Jakarta Sans" font-weight="700" font-size="23" fill="#fcf8f5" text-anchor="start" letter-spacing="0">Your app</text><text x="124" y="254" font-family="Plus Jakarta Sans" font-weight="500" font-size="17" fill="rgba(252,248,245,0.6)" text-anchor="start" letter-spacing="0">in the browser or on a phone</text>
